[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colombia-utils"
version = "0.1.0"
description = "Colombian holidays, business days and NIT check digits. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kilian Vega" }]
requires-python = ">=3.10"
keywords = ["colombia", "holidays", "festivos", "business days", "nit", "dian"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
]

[project.urls]
Repository = "https://github.com/cuajada69/colombia-utils"
Issues = "https://github.com/cuajada69/colombia-utils/issues"

[dependency-groups]
dev = ["pytest>=8"]
